name = "bvc-nour-assistant"
main = "worker.mjs"
compatibility_date = "2026-10-01"
# Preserve the administrator's runtime kill switch across code deployments.
keep_vars = true

[ai]
binding = "AI"

[vars]
# NOUR_AI_ENABLED is managed only in the dashboard. Missing means disabled.
MONTHLY_CALL_LIMIT = "300"
USER_MONTHLY_CALL_LIMIT = "100"
USER_MINUTE_CALL_LIMIT = "8"

[[durable_objects.bindings]]
name = "NOUR_QUOTA"
class_name = "NourQuota"

[[migrations]]
tag = "nour-quota-v1"
new_sqlite_classes = ["NourQuota"]
