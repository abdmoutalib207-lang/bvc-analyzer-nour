name: Nour market, news and public site
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Édition manuelle (auto ne remplace aucune édition programmée)'
        default: auto
        type: choice
        options: [auto, morning, midday, closing, refresh, preclose]
      scheduled_for:
        description: 'Occurrence Casablanca à rattraper, ISO 8601 avec fuseau (watchdog)'
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - 'nour/**'
      - 'knowledge/**'
      - 'backend/**'
      - 'tools/**'
      - 'tests/**'
      - 'run.py'
      - 'web/nour.js'
      - 'web/diagnostics.js'
      - 'web/chart.js'
      - 'web/chart-controls.js'
      - 'web/market.js'
      - 'web/research.js'
      - 'web/assistant.js'
      - 'web/assistant-domains.js'
      - 'web/assistant.css'
      - 'web/assistant-config.json'
      - 'web/nour.css'
      - 'web/logos/**'
      - 'data/company_logos.json'
      - 'data/market_reference.json'
      - 'data/volume_history.json'
      - 'vendor/ecc/**'
      - '.agents/**'
      - '.claude/**'
      - '.ecc/**'
      - '.gitattributes'
      - '.github/workflows/nour_daily.yml'
  schedule:
    - cron: '45 9 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 12 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '0 16 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '15 17 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '0 19 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 10 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 11 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 13 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 14 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 15 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 16 * * 1-5'
      timezone: 'Africa/Casablanca'
    - cron: '45 17 * * 1-5'
      timezone: 'Africa/Casablanca'
    # Redundant opening wake; the gate retries an empty early source once.
    - cron: '55 9 * * 1-5'
      timezone: 'Africa/Casablanca'
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: nour-publication
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      run: ${{ steps.gate.outputs.run }}
      slot: ${{ steps.gate.outputs.slot }}
      scheduled_for: ${{ steps.gate.outputs.scheduled_for }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce Nour-only write scope
        run: python tools/assert_nour_scope.py
      - name: Resolve current-day slot and avoid duplicate verified publications
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          NOUR_REQUESTED_SLOT: ${{ inputs.slot || 'auto' }}
          NOUR_REQUESTED_FOR: ${{ inputs.scheduled_for }}
        run: python tools/plan_market_run.py
  update:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued event SHA may precede a prior publication's data commit.
          # Concurrency serializes jobs, but does not refresh that event SHA.
          ref: main
      - name: Record actual runner start
        run: |
          echo "NOUR_STARTED_AT=$(date --iso-8601=seconds)" >> "$GITHUB_ENV"
          echo "NOUR_CODE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce Nour-only write scope
        run: python tools/assert_nour_scope.py
      - name: Collect intraday observations or completed session
        id: market
        continue-on-error: true
        run: python tools/update_market.py
      - name: Refresh official documents and press radar
        id: news
        continue-on-error: true
        run: python tools/update_news.py
      - name: Discover official financial documents at the 16h edition (candidates only)
        id: official_sources
        if: needs.plan.outputs.slot == 'closing' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.slot != 'auto' && inputs.scheduled_for == '')
        continue-on-error: true
        run: python tools/update_official_sources.py
      - name: Discover sector publications from official Moroccan institutions
        id: sector_sources
        if: needs.plan.outputs.slot == 'closing' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.slot != 'auto' && inputs.scheduled_for == '')
        continue-on-error: true
        run: python tools/update_sector_sources.py
      - name: Refresh MASI and market overview directly from CDG
        id: overview
        continue-on-error: true
        run: python tools/update_overview.py
      - name: Refresh independent international market snapshots
        id: macro
        continue-on-error: true
        run: python tools/update_macro.py
      - name: Cross-check final amounts and quantities with a second market provider
        id: integrity
        continue-on-error: true
        run: python tools/check_market_integrity.py
      - name: Build dashboard and briefing
        env:
          NOUR_SCHEDULE: ${{ github.event.schedule }}
          NOUR_SLOT: ${{ needs.plan.outputs.slot }}
          NOUR_SCHEDULED_FOR: ${{ needs.plan.outputs.scheduled_for }}
        run: python run.py --asof "$(TZ=Africa/Casablanca date +%F)" --slot "$NOUR_SLOT"
      - name: Verify the generated output
        run: |
          set -o pipefail
          python tools/verify_nour.py 2>&1 | tee "$RUNNER_TEMP/nour-verification.log"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser QA runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/nour-browser-qa" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          # Runner already carries Chromium libraries and Latin/emoji fonts.
          # Launch/tests still fail if a required dependency is missing.
          "$RUNNER_TEMP/nour-browser-qa/node_modules/.bin/playwright" install --only-shell chromium
      - name: Exercise generated assistant in real Chromium
        env:
          NODE_PATH: ${{ runner.temp }}/nour-browser-qa/node_modules
          NOUR_SCREENSHOTS: ${{ runner.temp }}/nour-browser-qa-shots/local
        run: |
          python tools/serve_assistant.py --port 8766 &
          nour_server_pid=$!
          trap 'kill "$nour_server_pid"' EXIT
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for attempt in range(25):
              try:
                  with urlopen('http://127.0.0.1:8766/assistant-config.json', timeout=2):
                      break
              except OSError:
                  if attempt == 24:
                      raise
                  time.sleep(.2)
          PY
          node tools/test_assistant_browser.cjs
      - name: Save validated snapshots and pages
        run: |
          git config user.name 'bvc-nour-bot'
          git config user.email 'bvc-nour-bot@users.noreply.github.com'
          git add data web
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Nour market and news snapshots"
            git push
          fi
      - name: Record exact publication artifact identity
        run: python tools/record_publication.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Exercise the actually published Nour site
        env:
          NODE_PATH: ${{ runner.temp }}/nour-browser-qa/node_modules
          NOUR_SCREENSHOTS: ${{ runner.temp }}/nour-browser-qa-shots/published
          NOUR_PUBLISHED_URL: ${{ steps.deployment.outputs.page_url }}
        run: node tools/test_assistant_browser.cjs "$NOUR_PUBLISHED_URL"
      - name: Audit amounts and quantities actually served after deployment
        run: python tools/audit_market_integrity.py --public --generator-commit "$NOUR_CODE_COMMIT"
      - name: Preserve browser QA screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nour-assistant-browser-qa
          path: ${{ runner.temp }}/nour-browser-qa-shots
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve failed verification diagnostics (not published)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: nour-failed-verification
          path: |
            ${{ runner.temp }}/nour-verification.log
            data/health.json
            data/market_snapshot.json
            data/market_overview.json
            data/last_healthy.json
            data/overview_health.json
            data/official_sources_health.json
            data/market_integrity.json
            data/market_integrity_log.json
            data/error_memory.json
            web/financial-health.json
            web/runtime.json
            web/assistant-data.json
            web/report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Report collector outcomes
        if: always()
        run: |
          python tools/collector_summary.py
          echo 'Market: ${{ steps.market.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'News: ${{ steps.news.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Official document discovery: ${{ steps.official_sources.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Sector publication discovery: ${{ steps.sector_sources.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'MASI: ${{ steps.overview.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Macro: ${{ steps.macro.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Market integrity: ${{ steps.integrity.outcome }}' >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve error memory even when publication is refused
        if: always()
        run: |
          git config user.name 'bvc-nour-bot'
          git config user.email 'bvc-nour-bot@users.noreply.github.com'
          git restore --staged -- data web
          # Active market_integrity.json belongs to the snapshot transaction.
          # Failure evidence remains in the audit journal and uploaded diagnostics.
          for nour_diagnostic in data/error_memory.json data/market_integrity_log.json data/anomalies.json; do
            if test -f "$nour_diagnostic"; then git add "$nour_diagnostic"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Preserve Nour market-control incident memory"
            git push
          fi
